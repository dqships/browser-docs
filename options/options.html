<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebToMarkdown Settings</title>
  <link rel="stylesheet" href="../shared/styles/fonts.css">
  <link rel="stylesheet" href="../shared/styles/tokens.css">
  <link rel="stylesheet" href="./options.css">
  <script src="../shared/vendor/browser-polyfill.min.js"></script>
</head>

<body>
  <main class="settings-shell">
    <header class="settings-header">
      <p class="brand">
        <img class="brand-mark" src="../shared/icons/logo-mark.svg" alt="" width="24" height="24">
        WebToMarkdown
      </p>
      <h1>Settings</h1>
      <p class="settings-intro">Choose what the exported Markdown should include.</p>
      <dl class="settings-shortcut">
        <div>
          <dt>Mac</dt>
          <dd><kbd>⌥ Option</kbd><kbd>⇧ Shift</kbd><kbd>M</kbd></dd>
        </div>
        <div>
          <dt>Windows</dt>
          <dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>M</kbd></dd>
        </div>
      </dl>
    </header>

    <form id="settings-form" class="settings-form">
      <label class="setting">
        <input id="aggressivePruning" name="aggressivePruning" type="checkbox">
        <span>
          <strong>Aggressive pruning</strong>
          <small>Remove sidebars, toolbars, feedback widgets, cookie prompts, and similar chrome.</small>
        </span>
      </label>

      <label class="setting">
        <input id="includeFrontmatter" name="includeFrontmatter" type="checkbox">
        <span>
          <strong>Include frontmatter</strong>
          <small>Add title, source URL, and capture time as YAML frontmatter.</small>
        </span>
      </label>

      <label class="setting">
        <input id="includeTitleHeading" name="includeTitleHeading" type="checkbox">
        <span>
          <strong>Include title heading</strong>
          <small>Insert a top-level Markdown heading when it is not already present.</small>
        </span>
      </label>

      <label class="setting">
        <input id="includeSourceLink" name="includeSourceLink" type="checkbox">
        <span>
          <strong>Include source link</strong>
          <small>Add a plain source URL line near the top of the document.</small>
        </span>
      </label>

      <label class="setting">
        <input id="preserveTables" name="preserveTables" type="checkbox">
        <span>
          <strong>Preserve tables</strong>
          <small>Convert HTML tables into Markdown pipe tables where possible.</small>
        </span>
      </label>

      <div class="actions">
        <button type="submit">Save Settings</button>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </form>
  </main>

  <script type="module" src="./options.js"></script>
</body>

</html>
