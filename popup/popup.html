<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebToMarkdown</title>
  <link rel="stylesheet" href="../shared/styles/fonts.css">
  <link rel="stylesheet" href="../shared/styles/tokens.css">
  <link rel="stylesheet" href="../shared/styles/settings-form.css">
  <link rel="stylesheet" href="./popup.css">
  <script src="../shared/vendor/browser-polyfill.min.js"></script>
</head>

<body>
  <main class="popup-shell">
    <header class="masthead">
      <span class="brand">
        <img class="brand-mark" src="../shared/icons/logo-mark.svg" alt="" width="20" height="20">
        WebToMarkdown
      </span>
      <span class="shortcut" title="Keyboard shortcut">
        <kbd>⌥</kbd><kbd>⇧</kbd><kbd>M</kbd>
      </span>
    </header>

    <div class="popup-views">
      <section class="popup-view" data-view="main">
        <section class="hero">
          <h1 tabindex="-1" data-view-heading>Copy this page as Markdown.</h1>
          <p class="subcopy">
            Takes the readable part of the page, keeps its structure, and puts it on your clipboard.
          </p>
        </section>

        <section class="actions">
          <button id="copy-button" class="primary-button" type="button">
            Copy Current Page
          </button>
        </section>

        <p id="status" class="status" aria-live="polite">Ready.</p>

        <section id="result-panel" class="result-panel hidden" aria-live="polite">
          <dl class="stat-grid">
            <div class="stat-card">
              <dt class="stat-label">Words</dt>
              <dd id="word-count">0</dd>
            </div>
            <div class="stat-card">
              <dt class="stat-label">Characters</dt>
              <dd id="char-count">0</dd>
            </div>
          </dl>

          <label class="preview-label" for="preview">Preview</label>
          <textarea id="preview" class="preview" readonly></textarea>
        </section>
      </section>

      <section class="popup-view" data-view="settings" aria-labelledby="settings-heading" hidden>
        <div class="view-header">
          <button class="back-button" type="button" data-back-view="main">Back</button>
          <h1 id="settings-heading" tabindex="-1" data-view-heading>Settings</h1>
        </div>

        <p class="subcopy">Choose what the exported Markdown should include.</p>

        <dl class="shortcut-hint">
          <div>
            <dt>Mac</dt>
            <dd><kbd>⌥ Option</kbd><kbd>⇧ Shift</kbd><kbd>M</kbd></dd>
          </div>
          <div>
            <dt>Windows</dt>
            <dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>M</kbd></dd>
          </div>
        </dl>

        <form class="settings-form" data-settings-form>
          <div class="settings-list" data-settings-list></div>
        </form>

        <p class="status" aria-live="polite" data-settings-status>Changes save as you go.</p>
      </section>
      <!-- T3 adds data-view="history" -->
    </div>

    <div id="prompt-slot" class="prompt-slot"></div>

    <nav class="popup-footer" aria-label="More">
      <button type="button" data-open-view="settings">Settings</button>
      <!-- T3 adds History, T4 adds Rate and Share -->
    </nav>
  </main>

  <script type="module" src="./popup.js"></script>
</body>

</html>
